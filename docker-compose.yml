services:
  # The schema is created once, before anything that reads it starts. Leaving
  # it to the API's own startup raced the worker, whose WORKER_STARTUP sweep
  # queries `documents` the moment it boots: on a fresh volume the worker lost
  # that race and died on `relation "documents" does not exist`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: python scripts/create_tables.py
    restart: "no"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/code/src
      - ./backend/scripts:/code/scripts
      - ./.env:/code/.env

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.interfaces.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./.env
    environment:
      # `migrate` owns the schema; two creators racing is what this fixes.
      - CREATE_TABLES_ON_STARTUP=false
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/code/src
      - ./backend/eval:/code/eval
      - ./samples:/code/samples
      - ./backend/scripts:/code/scripts
      - ./.env:/code/.env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: taskiq worker src.infrastructure.taskiq.worker:broker --workers 1
    healthcheck:
      disable: true
    env_file:
      - ./.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/code/src
      - ./.env:/code/.env

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ragdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
