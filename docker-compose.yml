services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.interfaces.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/code/src
      - ./eval:/code/eval
      - ./samples:/code/samples
      - ./.env:/code/.env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: taskiq worker src.infrastructure.taskiq.worker:broker --workers 1
    healthcheck:
      disable: true
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/code/src
      - ./.env:/code/.env

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ragdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
