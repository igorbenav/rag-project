<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372">
  <style>
    .bg     { fill: #f8f9fa; }
    .title  { font-family: 'Arial', sans-serif; font-size: 15px; font-weight: bold; fill: #333; }
    .head   { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; fill: #555; }
    .row    { font-family: 'Arial', sans-serif; font-size: 11.5px; fill: #333; }
    .score  { font-family: 'Arial', sans-serif; font-size: 10.5px; text-anchor: end; fill: #777; }
    .rank   { font-family: 'Arial', sans-serif; font-size: 10px; fill: #aaa; }
    .formula{ font-family: 'Georgia', serif; font-size: 12px; font-style: italic; text-anchor: middle; fill: #666; }
    .note   { font-family: 'Arial', sans-serif; font-size: 10.5px; fill: #666; }
    .dense  { fill: #e6f4ff; stroke: #1890ff; stroke-width: 1.2; }
    .lex    { fill: #fff3e8; stroke: #fa8c16; stroke-width: 1.2; }
    .out    { fill: #fff;    stroke: #bbb;    stroke-width: 1.2; }
    .win    { fill: #fff;    stroke: #333;    stroke-width: 1.8; }
    .plus   { font-family: 'Arial', sans-serif; font-size: 20px; text-anchor: middle; fill: #aaa; }
    .arrow  { stroke: #999; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="760" height="372" class="bg"/>
  <text x="28" y="26" class="title">Agreement beats a single strong opinion</text>
  <text x="380" y="48" class="formula">score(chunk) = Σ 1 / (60 + rank)</text>

  <!-- dense -->
  <text x="118" y="82" class="head">Dense results</text>
  <g>
    <rect x="38" y="94"  width="160" height="30" rx="3" class="dense"/><text x="52" y="114" class="rank">1</text><text x="76" y="114" class="row">chunk C4</text>
    <rect x="38" y="130" width="160" height="30" rx="3" class="dense"/><text x="52" y="150" class="rank">2</text><text x="76" y="150" class="row">chunk C8</text>
    <rect x="38" y="166" width="160" height="30" rx="3" class="dense"/><text x="52" y="186" class="rank">3</text><text x="76" y="186" class="row">chunk C2</text>
    <rect x="38" y="202" width="160" height="30" rx="3" class="dense"/><text x="52" y="222" class="rank">4</text><text x="76" y="222" class="row">chunk C6</text>
  </g>

  <text x="238" y="168" class="plus">+</text>

  <!-- bm25 -->
  <text x="358" y="82" class="head">BM25 results</text>
  <g>
    <rect x="278" y="94"  width="160" height="30" rx="3" class="lex"/><text x="292" y="114" class="rank">1</text><text x="316" y="114" class="row">chunk C1</text>
    <rect x="278" y="130" width="160" height="30" rx="3" class="lex"/><text x="292" y="150" class="rank">2</text><text x="316" y="150" class="row">chunk C8</text>
    <rect x="278" y="166" width="160" height="30" rx="3" class="lex"/><text x="292" y="186" class="rank">3</text><text x="316" y="186" class="row">chunk C5</text>
    <rect x="278" y="202" width="160" height="30" rx="3" class="lex"/><text x="292" y="222" class="rank">4</text><text x="316" y="222" class="row">chunk C9</text>
  </g>

  <line x1="446" y1="163" x2="486" y2="163" class="arrow"/>

  <!-- fused -->
  <text x="612" y="82" class="head">After fusion</text>
  <g>
    <rect x="502" y="94"  width="220" height="30" rx="3" class="win"/><text x="516" y="114" class="rank">1</text><text x="540" y="114" class="row">chunk C8</text><text x="708" y="114" class="score">.0323</text>
    <rect x="502" y="130" width="220" height="30" rx="3" class="out"/><text x="516" y="150" class="rank">2</text><text x="540" y="150" class="row">chunk C4</text><text x="708" y="150" class="score">.0164</text>
    <rect x="502" y="166" width="220" height="30" rx="3" class="out"/><text x="516" y="186" class="rank">3</text><text x="540" y="186" class="row">chunk C1</text><text x="708" y="186" class="score">.0164</text>
    <rect x="502" y="202" width="220" height="30" rx="3" class="out"/><text x="516" y="222" class="rank">4</text><text x="540" y="222" class="row">chunk C2</text><text x="708" y="222" class="score">.0159</text>
    <rect x="502" y="238" width="220" height="30" rx="3" class="out"/><text x="516" y="258" class="rank">5</text><text x="540" y="258" class="row">chunk C5</text><text x="708" y="258" class="score">.0159</text>
  </g>

  <line x1="38" y1="290" x2="722" y2="290" stroke="#e2e2e2" stroke-width="1"/>
  <text x="38" y="314" class="note">C8 is second on both lists and wins: 1/62 + 1/62 = .0323.</text>
  <text x="38" y="334" class="note">C4 and C1 each top one list and are absent from the other, so each scores 1/61 once — .0164.</text>
  <text x="38" y="354" class="note">The magnitudes never enter the arithmetic, which is the point: cosine and BM25 are not on a shared scale.</text>
</svg>
